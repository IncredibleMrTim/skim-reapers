name: CI/CD

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: write

jobs:
  build:
    name: Lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run build

      - name: Package standalone output
        if: github.event_name == 'push'
        run: |
          cp -r public .next/standalone/
          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/
          cat > .next/standalone/.cpanel.yml <<'EOF'
          ---
          # Deploy-only branch: contents are the built standalone output,
          # pushed by .github/workflows/deploy.yml. Nothing here is built
          # on the server — just restart Passenger to pick up new files.
          deployment:
            tasks:
              - mkdir -p tmp && touch tmp/restart.txt
          EOF

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: standalone-build
          path: .next/standalone
          retention-days: 1
          include-hidden-files: true

  deploy-production:
    name: Deploy to skimreapers.co.uk
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      KRYSTAL_REPO_ROOT: ${{ secrets.KRYSTAL_PROD_REPO_ROOT }}
      DEPLOY_BRANCH: deploy/main
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: standalone-build
          path: standalone-build

      - name: Push standalone build to deploy branch
        run: |
          set -euo pipefail
          REPO_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

          # Append a normal commit on top of the deploy branch's existing
          # history (rather than force-pushing a fresh history each time)
          # so cPanel's VersionControl::update, which does a fast-forward
          # git pull, always succeeds instead of hitting "diverging
          # branches" on the second and later deploys.
          if git clone -q --depth 1 --branch "$DEPLOY_BRANCH" "$REPO_URL" deploy-repo 2>/dev/null; then
            find deploy-repo -mindepth 1 -maxdepth 1 -not -name '.git' -exec rm -rf {} +
          else
            mkdir -p deploy-repo
            (cd deploy-repo && git init -q && git checkout -q -b "$DEPLOY_BRANCH")
          fi
          cp -r standalone-build/. deploy-repo/
          cd deploy-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${{ github.sha }}" --allow-empty
          git push -q "$REPO_URL" "HEAD:$DEPLOY_BRANCH"

      - name: Pull + deploy via cPanel UAPI
        run: |
          set -euo pipefail
          BASE="https://${{ secrets.KRYSTAL_HOST }}:2083/execute"
          AUTH="Authorization: cpanel ${{ secrets.KRYSTAL_USER }}:${{ secrets.KRYSTAL_API_TOKEN }}"

          resp=$(curl -sf -H "$AUTH" "$BASE/VersionControl/update?repository_root=${KRYSTAL_REPO_ROOT}&branch=${DEPLOY_BRANCH}")
          echo "$resp" | jq .
          echo "$resp" | jq -e '.status == 1' >/dev/null

          resp=$(curl -sf -H "$AUTH" "$BASE/VersionControlDeployment/create?repository_root=${KRYSTAL_REPO_ROOT}")
          echo "$resp" | jq .
          echo "$resp" | jq -e '.status == 1' >/dev/null

  deploy-dev:
    name: Deploy to dev.skimreapers.co.uk
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    environment: dev
    env:
      KRYSTAL_REPO_ROOT: ${{ secrets.KRYSTAL_DEV_REPO_ROOT }}
      DEPLOY_BRANCH: deploy/dev
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: standalone-build
          path: standalone-build

      - name: Push standalone build to deploy branch
        run: |
          set -euo pipefail
          REPO_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

          # Append a normal commit on top of the deploy branch's existing
          # history (rather than force-pushing a fresh history each time)
          # so cPanel's VersionControl::update, which does a fast-forward
          # git pull, always succeeds instead of hitting "diverging
          # branches" on the second and later deploys.
          if git clone -q --depth 1 --branch "$DEPLOY_BRANCH" "$REPO_URL" deploy-repo 2>/dev/null; then
            find deploy-repo -mindepth 1 -maxdepth 1 -not -name '.git' -exec rm -rf {} +
          else
            mkdir -p deploy-repo
            (cd deploy-repo && git init -q && git checkout -q -b "$DEPLOY_BRANCH")
          fi
          cp -r standalone-build/. deploy-repo/
          cd deploy-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${{ github.sha }}" --allow-empty
          git push -q "$REPO_URL" "HEAD:$DEPLOY_BRANCH"

      - name: Pull + deploy via cPanel UAPI
        run: |
          set -euo pipefail
          BASE="https://${{ secrets.KRYSTAL_HOST }}:2083/execute"
          AUTH="Authorization: cpanel ${{ secrets.KRYSTAL_USER }}:${{ secrets.KRYSTAL_API_TOKEN }}"

          resp=$(curl -sf -H "$AUTH" "$BASE/VersionControl/update?repository_root=${KRYSTAL_REPO_ROOT}&branch=${DEPLOY_BRANCH}")
          echo "$resp" | jq .
          echo "$resp" | jq -e '.status == 1' >/dev/null

          resp=$(curl -sf -H "$AUTH" "$BASE/VersionControlDeployment/create?repository_root=${KRYSTAL_REPO_ROOT}")
          echo "$resp" | jq .
          echo "$resp" | jq -e '.status == 1' >/dev/null
