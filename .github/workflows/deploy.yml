name: CI/CD

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build:
    name: Lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run build

  deploy-production:
    name: Deploy to skimreapers.co.uk
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      # Requires SSH key access to the Krystal cPanel account (see
      # docs/deploy-krystal.md). Pulls the latest commit into the
      # server-side repo, then triggers `.cpanel.yml`'s deployment
      # tasks (install, build, Passenger restart) via cPanel's UAPI.
      - name: SSH pull + deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.KRYSTAL_SSH_HOST }}
          username: ${{ secrets.KRYSTAL_SSH_USER }}
          key: ${{ secrets.KRYSTAL_SSH_KEY }}
          port: ${{ secrets.KRYSTAL_SSH_PORT || 22 }}
          script: |
            set -e
            cd "${{ secrets.KRYSTAL_PROD_REPO_ROOT }}"
            git pull origin main
            uapi VersionControl deployment create repository_root="${{ secrets.KRYSTAL_PROD_REPO_ROOT }}"

  deploy-dev:
    name: Deploy to dev.skimreapers.co.uk
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: SSH pull + deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.KRYSTAL_SSH_HOST }}
          username: ${{ secrets.KRYSTAL_SSH_USER }}
          key: ${{ secrets.KRYSTAL_SSH_KEY }}
          port: ${{ secrets.KRYSTAL_SSH_PORT || 22 }}
          script: |
            set -e
            cd "${{ secrets.KRYSTAL_DEV_REPO_ROOT }}"
            git pull origin dev
            uapi VersionControl deployment create repository_root="${{ secrets.KRYSTAL_DEV_REPO_ROOT }}"
