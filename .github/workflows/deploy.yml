name: CI/CD

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  # Sanity calls this directly (POST to the GitHub API's /dispatches
  # endpoint) on every publish. dev and production are separate Sanity
  # datasets now, each with its own webhook sending its own event_type,
  # so a publish only rebuilds and deploys the matching environment.
  # See docs/deploy-krystal.md for the webhook setup.
  repository_dispatch:
    types: [sanity-publish-dev, sanity-publish-prod]

permissions:
  contents: write

jobs:
  build-dev:
    name: Lint & build (dev)
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/dev') ||
      (github.event_name == 'pull_request' && github.base_ref == 'dev') ||
      (github.event_name == 'repository_dispatch' && github.event.action == 'sanity-publish-dev')
    runs-on: ubuntu-latest
    environment: dev
    env:
      NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ vars.NEXT_PUBLIC_SANITY_PROJECT_ID }}
      NEXT_PUBLIC_SANITY_DATASET: ${{ vars.NEXT_PUBLIC_SANITY_DATASET }}
      NEXT_PUBLIC_SANITY_API_VERSION: ${{ vars.NEXT_PUBLIC_SANITY_API_VERSION }}
    steps:
      - uses: actions/checkout@v4
        with:
          # repository_dispatch (Sanity's webhook) has no natural branch
          # context, so pin it to the dev branch — the dev dataset's
          # publish should always rebuild dev's own code.
          ref: ${{ github.event_name == 'repository_dispatch' && 'dev' || github.ref }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run build

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: static-build-dev
          path: out
          retention-days: 1
          include-hidden-files: true

  build-prod:
    name: Lint & build (production)
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.base_ref == 'main') ||
      (github.event_name == 'repository_dispatch' && github.event.action == 'sanity-publish-prod')
    runs-on: ubuntu-latest
    environment: production
    env:
      NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ vars.NEXT_PUBLIC_SANITY_PROJECT_ID }}
      NEXT_PUBLIC_SANITY_DATASET: ${{ vars.NEXT_PUBLIC_SANITY_DATASET }}
      NEXT_PUBLIC_SANITY_API_VERSION: ${{ vars.NEXT_PUBLIC_SANITY_API_VERSION }}
    steps:
      - uses: actions/checkout@v4
        with:
          # repository_dispatch (Sanity's webhook) has no natural branch
          # context, so pin it to main — the production dataset's
          # publish should always rebuild main's own code.
          ref: ${{ github.event_name == 'repository_dispatch' && 'main' || github.ref }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run build

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: static-build-prod
          path: out
          retention-days: 1
          include-hidden-files: true

  deploy-production:
    name: Deploy to skimreapers.co.uk
    needs: build-prod
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'repository_dispatch' && github.event.action == 'sanity-publish-prod')
    runs-on: ubuntu-latest
    environment: production
    env:
      KRYSTAL_REPO_ROOT: ${{ secrets.KRYSTAL_PROD_REPO_ROOT }}
      DEPLOY_BRANCH: deploy/main
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: static-build-prod
          path: static-build

      - name: Push static build to deploy branch
        run: |
          set -euo pipefail
          REPO_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

          # Append a normal commit on top of the deploy branch's existing
          # history (rather than force-pushing a fresh history each time)
          # so cPanel's VersionControl::update, which does a fast-forward
          # git pull, always succeeds instead of hitting "diverging
          # branches" on the second and later deploys.
          if git clone -q --depth 1 --branch "$DEPLOY_BRANCH" "$REPO_URL" deploy-repo 2>/dev/null; then
            find deploy-repo -mindepth 1 -maxdepth 1 -not -name '.git' -exec rm -rf {} +
          else
            mkdir -p deploy-repo
            (cd deploy-repo && git init -q && git checkout -q -b "$DEPLOY_BRANCH")
          fi
          cp -r static-build/. deploy-repo/
          cd deploy-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${{ github.sha }}" --allow-empty
          git push -q "$REPO_URL" "HEAD:$DEPLOY_BRANCH"

      - name: Pull into Krystal via cPanel UAPI
        run: |
          set -euo pipefail
          BASE="https://${{ secrets.KRYSTAL_HOST }}:2083/execute"
          AUTH="Authorization: cpanel ${{ secrets.KRYSTAL_USER }}:${{ secrets.KRYSTAL_API_TOKEN }}"

          # Repository path == document root for static deploys, so a
          # plain git pull (VersionControl::update) is the entire
          # deployment — no Passenger/Node app, no deployment/restart
          # step needed for static files.
          resp=$(curl -sf -H "$AUTH" "$BASE/VersionControl/update?repository_root=${KRYSTAL_REPO_ROOT}&branch=${DEPLOY_BRANCH}")
          echo "$resp" | jq .
          echo "$resp" | jq -e '.status == 1' >/dev/null

  deploy-dev:
    name: Deploy to dev.skimreapers.co.uk
    needs: build-dev
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/dev') ||
      (github.event_name == 'repository_dispatch' && github.event.action == 'sanity-publish-dev')
    runs-on: ubuntu-latest
    environment: dev
    env:
      KRYSTAL_REPO_ROOT: ${{ secrets.KRYSTAL_DEV_REPO_ROOT }}
      DEPLOY_BRANCH: deploy/dev
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: static-build-dev
          path: static-build

      - name: Push static build to deploy branch
        run: |
          set -euo pipefail
          REPO_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

          if git clone -q --depth 1 --branch "$DEPLOY_BRANCH" "$REPO_URL" deploy-repo 2>/dev/null; then
            find deploy-repo -mindepth 1 -maxdepth 1 -not -name '.git' -exec rm -rf {} +
          else
            mkdir -p deploy-repo
            (cd deploy-repo && git init -q && git checkout -q -b "$DEPLOY_BRANCH")
          fi
          cp -r static-build/. deploy-repo/
          cd deploy-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${{ github.sha }}" --allow-empty
          git push -q "$REPO_URL" "HEAD:$DEPLOY_BRANCH"

      - name: Pull into Krystal via cPanel UAPI
        run: |
          set -euo pipefail
          BASE="https://${{ secrets.KRYSTAL_HOST }}:2083/execute"
          AUTH="Authorization: cpanel ${{ secrets.KRYSTAL_USER }}:${{ secrets.KRYSTAL_API_TOKEN }}"

          resp=$(curl -sf -H "$AUTH" "$BASE/VersionControl/update?repository_root=${KRYSTAL_REPO_ROOT}&branch=${DEPLOY_BRANCH}")
          echo "$resp" | jq .
          echo "$resp" | jq -e '.status == 1' >/dev/null
