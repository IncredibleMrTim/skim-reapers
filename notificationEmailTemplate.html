<html>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>
<body>
  <div style="width: 100%; max-width: 600px; margin: 0 auto; padding: 20px; box-sizing: border-box; color: #1a1a1a; background: #ffffff; font-family: arial;">
    <div style="width: 100%; text-align: center; margin-top: 20px;">
      <img src="{{base_url}}/logo_extracted1_dark.png" alt="Skim Reapers" width="160" />
    </div>
    <h1 style="font-size: 18px;">New quote request</h1>
    <p>A new enquiry has come in through the website contact form.</p>
    <br />
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width: 100%;">
      <tr>
        <td style="padding: 6px 0; color: #6b6460; width: 90px; vertical-align: top;">Name</td>
        <td style="padding: 6px 0; color: #1a1a1a;">{{name}}</td>
      </tr>
      <tr>
        <td style="padding: 6px 0; color: #6b6460; vertical-align: top;">Email</td>
        <td style="padding: 6px 0; color: #1a1a1a;">
          <a href="mailto:{{email}}" style="color: #1a1a1a; text-decoration: underline;">{{email}}</a>
        </td>
      </tr>
      <tr>
        <td style="padding: 6px 0; color: #6b6460; vertical-align: top;">Business</td>
        <td style="padding: 6px 0; color: #1a1a1a;">{{business}}</td>
      </tr>
      <tr>
        <td style="padding: 6px 0; color: #6b6460; vertical-align: top;">Phone</td>
        <td style="padding: 6px 0; color: #1a1a1a;">{{phone}}</td>
      </tr>
    </table>
    <br />
    <div style="border: 1px solid #e5e5e5; border-radius: 4px;">
      <h2 style="font-size: 18px; border-bottom: 1px solid #e5e5e5; background: #AF7C3C; color: #ffffff; margin: 0; padding: 10px;">Message</h2>
      <p style="padding: 10px;">{{message}}</p>
    </div>
    <br />
    <p style="color: #6b6460; font-size: 13px;">Reply directly to this email to respond to {{name}}.</p>
  </div>
</body>
</html>
