<html>
<head>
<meta charset="UTF-8" />
</head>
<body>
  <div style="width: 100%; padding: 10px; color: white; background: black; font-family: arial;">
    <div style="max-height: 0; position: relative; opacity: 0.999;">
      <!--[if mso]>
      <v:rect xmlns:v="urn:schemas-microsoft-com:vml" stroked="false" style="mso-width-percent:500; height:900px; position:absolute; top:0px; left:0px;">
      <v:fill type="frame" src="{{base_url}}/smoke_bg.webp" opacity="0.2" color="#000000" />
      </v:rect>
      <v:rect xmlns:v="urn:schemas-microsoft-com:vml" stroked="false" filled="false" style="mso-width-percent:500; position:absolute; top:0px; left:0px;">
      <v:textbox inset="0,0,0,0">
      <![endif]-->
      <div style="display: inline-block; padding: 18px; box-sizing: border-box;">
        <div style="width: 100%; text-align: center; margin-top: 20px;">
          <img src="{{base_url}}/logo_extracted1.png" alt="Skim Reapers" width="160" />
        </div>
        <h1 style="font-size: 18px;">New quote request</h1>
        <p>A new enquiry has come in through the website contact form.</p>
        <br />
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width: 100%;">
          <tr>
            <td style="padding: 6px 0; color: #a09890; width: 90px; vertical-align: top;">Name</td>
            <td style="padding: 6px 0; color: white;">{{name}}</td>
          </tr>
          <tr>
            <td style="padding: 6px 0; color: #a09890; vertical-align: top;">Email</td>
            <td style="padding: 6px 0; color: white;">
              <a href="mailto:{{email}}" style="color: white; text-decoration: underline;">{{email}}</a>
            </td>
          </tr>
          <tr>
            <td style="padding: 6px 0; color: #a09890; vertical-align: top;">Business</td>
            <td style="padding: 6px 0; color: white;">{{business}}</td>
          </tr>
          <tr>
            <td style="padding: 6px 0; color: #a09890; vertical-align: top;">Phone</td>
            <td style="padding: 6px 0; color: white;">{{phone}}</td>
          </tr>
        </table>
        <br />
        <div style="border: 1px solid; border-radius: 4px; border-color: #AF7C3C; ">
          <h2 style="font-size: 18px; border-bottom: 1px solid rgba(0, 0, 0, 0.1); background: #AF7C3C; margin:0; padding: 10px;">Message</h2>
          <p style="padding: 10px;">{{message}}</p>
        </div>
        <br />
        <p style="color: #a09890; font-size: 13px;">Reply directly to this email to respond to {{name}}.</p>
      </div>
      <!--[if mso]>
      </v:textbox>
      </v:rect>
      <![endif]-->
    </div>
    <!--[if !mso]><!-->
    <img src="{{base_url}}/smoke_bg.webp" alt="" width="600" style="width: 100%; display: block; opacity: 0.2; pointer-events: none;" />
    <!--<![endif]-->
  </div>
</body>
</html>
